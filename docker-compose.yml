name: golem-social-net-rust-otel

services:
  # OpenTelemetry Collector Contrib
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: golem-social-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${OTLP_PORT:-4318}:4318"      # OTLP HTTP (used by Golem otlp-exporter)
      - "8889:8889"                    # Prometheus metrics exposed by collector
    networks:
      - golem-social-network
    depends_on:
      - jaeger

  # Jaeger All-in-One (Tracing UI & Collector)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: golem-social-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_PORT:-16686}:16686" # Web UI
    networks:
      - golem-social-network

  # Prometheus (Metrics Storage & Scraper)
  prometheus:
    image: prom/prometheus:latest
    container_name: golem-social-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090" # Web UI & API
    networks:
      - golem-social-network

  # Grafana (Unified Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: golem-social-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000" # Web UI
    networks:
      - golem-social-network
    depends_on:
      - prometheus
      - jaeger

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  golem-social-network:
    name: golem-social-network
    driver: bridge
