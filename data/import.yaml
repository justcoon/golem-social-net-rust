---
base: '{{ HOST }}'
iterations: 1
concurrency: 1
rampup: 1

plan:
  - name: Set user names, index {{ index }}
    request:
      url: /v1/social-net/users/{{ item.user_id }}/name
      method: PUT
      body: '{{ item.body }}'
      headers:
        host: '{{ API_HOST }}'
        Content-Type: 'application/json'
        Accept: 'application/json'
    with_items_from_csv:
      file_name: ./fixtures/users_name.csv
      quote_char: "'"
  - name: Set user emails, index {{ index }}
    request:
      url: /v1/social-net/users/{{ item.user_id }}/email
      method: PUT
      body: '{{ item.body }}'
      headers:
        host: '{{ API_HOST }}'
        Content-Type: 'application/json'
        Accept: 'application/json'
    with_items_from_csv:
      file_name: ./fixtures/users_email.csv
      quote_char: "'"
  - name: Add user friends, index {{ index }}
    request:
      url: /v1/social-net/users/{{ item.user_id }}/connections
      method: PUT
      body: '{{ item.body }}'
      headers:
        host: '{{ API_HOST }}'
        Content-Type: 'application/json'
        Accept: 'application/json'
    with_items_from_csv:
      file_name: ./fixtures/friends.csv
      quote_char: "'"
  - name: Add user followings, index {{ index }}
    request:
      url: /v1/social-net/users/{{ item.user_id }}/connections
      method: PUT
      body: '{{ item.body }}'
      headers:
        host: '{{ API_HOST }}'
        Content-Type: 'application/json'
        Accept: 'application/json'
    with_items_from_csv:
      file_name: ./fixtures/followings.csv
      quote_char: "'"
  - name: Add user post, index {{ index }}
    request:
      url: /v1/social-net/users/{{ item.user_id }}/posts
      method: POST
      body: '{{ item.body }}'
      headers:
        host: '{{ API_HOST }}'
        Content-Type: 'application/json'
        Accept: 'application/json'
    with_items_from_csv:
      file_name: ./fixtures/posts.csv
      quote_char: "'"


