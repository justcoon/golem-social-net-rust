[package]
name = "social_net_rust_social_net"
version = "0.0.1"
edition = "2024"

[workspace]
exclude = ["old", "benchmark"]

[profile.release]
opt-level = "s"
lto = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
log = { version = "0.4.29", features = ["kv"] }
golem-rust = { version = "2.0.0-dev.6", features = ["export_golem_agentic", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wstd = { version = "=0.6.5", features = ["default", "json"] }
chrono = "0.4.42"
email_address = "0.2.9"
uuid = { version = "1.18.1", features = ["v4"] }
regex = "1.12.2"
futures = "0.3.31"
md5 = "0.7.0"