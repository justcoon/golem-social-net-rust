manifestVersion: 1.6.0

app: golem-social-net-rust

environments:
  local:
    server: local
    componentPresets: release
  cloud:
    server: cloud
    componentPresets: release
components:
  social-net-rust:social-net:
    dir: ""
    templates: rust
#    plugins:
#      - name: golem-otlp-exporter
#        version: "1.5.8"
#        parameters:
#          endpoint: "{{ OTLP_ENDPOINT }}"
#          signals: "traces,logs,metrics"
#          # Intended to export clean agent type names; normalized in otel-collector due to Golem bug
#          service-name-mode: "agent-type"
    presets:
      local:
        default: true
mcp:
  deployments:
    local:
      - domain: localhost:9007
        agents:
          UserAgent: {}
httpApi:
  deployments:
    local:
    - domain: localhost:9006
      agents:
        UserAgent: {}
        UserSearchAgent: {}
        UserPostsAgent: {}
        UserChatsAgent: {}
        PostAgent: {}
        ChatAgent: {}
        UserChatsViewAgent: {}
        UserPostsViewAgent: {}
        UserTimelineViewAgent: {}
        UserChatsUpdatesAgent: {}
        UserTimelineUpdatesAgent: {}
        UserChatsUpdatesStreamAgent: {}
        UserTimelineUpdatesStreamAgent: {}
